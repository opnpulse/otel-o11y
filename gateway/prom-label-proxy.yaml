apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prom-label-proxy-route
  namespace: monitoring
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: thanos-gateway
      namespace: monitoring
      sectionName: https

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /telemetry
      backendRefs:
        - name: prom-label-proxy
          port: 8080
