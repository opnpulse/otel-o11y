apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: perses
  namespace: perses
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ace               # change if your Gateway name is different
      namespace: ace          # change if Gateway is in another namespace
      sectionName: https      # or http depending on your setup
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /observe
      backendRefs:
        - group: ""
          kind: Service
          name: perses
          port: 8080
          weight: 1