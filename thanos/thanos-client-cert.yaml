apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: otel-client-cert
  namespace: monitoring
spec:
  secretName: otel-client-cert
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: ace-gw
  commonName: otel-gateway
  usages:
  - digital signature
  - key encipherment
  - client auth

