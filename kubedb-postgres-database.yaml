      panels:
        "0":
          kind: Panel
          spec:
            display:
              description: Query per second
              name: QPS
            plugin:
              kind: StatChart
              spec:
                calculation: mean
                sparkline: {}
                thresholds:
                  steps:
                  - color: '#73bf69'
                    value: 0
                  - color: '#f2495c'
                    value: 80
            queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    minStep: ""
                    query: "sum(irate(pg_stat_database_xact_commit{datname=~\"$datname\",
                      pod=\"$pod\", namespace=\"$namespace\"}[5m])) + \nsum(irate(pg_stat_database_xact_rollback{datname=~\"$datname\",
                      pod=\"$pod\", namespace=\"$namespace\"}[5m]))"
                    seriesNameFormat: ""
        "1":
          kind: Panel
          spec:
            display:
              name: Transactions
            plugin:
              kind: TimeSeriesChart
              spec: {}
            queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    minStep: ""
                    query: irate(pg_stat_database_xact_commit{pod="$pod", namespace="$namespace",
                      datname=~"$datname"}[5m])
                    seriesNameFormat: ""
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    minStep: ""
                    query: irate(pg_stat_database_xact_rollback{pod="$pod", namespace="$namespace",
                      datname=~"$datname"}[5m])
                    seriesNameFormat: ""
        "2":
          kind: Panel
          spec:
            display:
              name: Update data
            plugin:
              kind: TimeSeriesChart
              spec: {}
            queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    minStep: ""
                    query: pg_stat_database_tup_updated{datname=~"$datname", pod="$pod",
                      namespace="$namespace"} != 0
                    seriesNameFormat: ""
        "3":
          kind: Panel
          spec:
            display:
              name: Active sessions
            plugin:
              kind: TimeSeriesChart
              spec: {}
            queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    minStep: ""
                    query: pg_stat_activity_count{datname=~"$datname", pod="$pod",
                      namespace="$namespace"} !=0
                    seriesNameFormat: ""
        "4":
          kind: Panel
          spec:
            display:
              name: Insert data
            plugin:
              kind: TimeSeriesChart
              spec: {}
            queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    minStep: ""
                    query: pg_stat_database_tup_inserted{datname=~"$datname", pod="$pod",
                      namespace="$namespace"} != 0
                    seriesNameFormat: ""
        "5":
          kind: Panel
          spec:
            display:
              name: Lock tables
            plugin:
              kind: TimeSeriesChart
              spec: {}
            queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    minStep: ""
                    query: pg_locks_count{datname=~"$datname", pod="$pod", namespace="$namespace"}
                      != 0
                    seriesNameFormat: ""
        "6":
          kind: Panel
          spec:
            display:
              name: Fetch data (SELECT)
            plugin:
              kind: TimeSeriesChart
              spec: {}
            queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    minStep: ""
                    query: pg_stat_database_tup_fetched{datname=~"$datname",pod="$pod",
                      namespace="$namespace"} != 0
                    seriesNameFormat: ""
        "7":
          kind: Panel
          spec:
            display:
              name: Idle sessions
            plugin:
              kind: TimeSeriesChart
              spec: {}
            queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    minStep: ""
                    query: pg_stat_activity_count{datname=~"$datname", pod="$pod",
                      namespace="$namespace", state=~"idle|idle in transaction|idle
                      in transaction (aborted)"}
                    seriesNameFormat: ""
        "8":
          kind: Panel
          spec:
            display:
              name: Delete data
            plugin:
              kind: TimeSeriesChart
              spec: {}
            queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    minStep: ""
                    query: pg_stat_database_tup_deleted{datname=~"$datname", pod="$pod",
                      namespace="$namespace"} != 0
                    seriesNameFormat: ""
        "9":
          kind: Panel
          spec:
            display:
              name: Return data
            plugin:
              kind: TimeSeriesChart
              spec: {}
            queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    minStep: ""
                    query: pg_stat_database_tup_returned{datname=~"$datname",pod="$pod",
                      namespace="$namespace"} != 0
                    seriesNameFormat: ""
        "10":
          kind: Panel
          spec:
            display:
              name: Buffers (bgwriter)
            plugin:
              kind: TimeSeriesChart
              spec: {}
            queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    minStep: ""
                    query: irate(pg_stat_bgwriter_buffers_backend{pod="$pod", namespace="$namespace"}[5m])
                    seriesNameFormat: ""
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    minStep: ""
                    query: irate(pg_stat_bgwriter_buffers_alloc{pod="$pod", namespace="$namespace"}[5m])
                    seriesNameFormat: ""
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    minStep: ""
                    query: irate(pg_stat_bgwriter_buffers_backend_fsync{pod="$pod",
                      namespace="$namespace"}[5m])
                    seriesNameFormat: ""
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    minStep: ""
                    query: irate(pg_stat_bgwriter_buffers_checkpoint{pod="$pod", namespace="$namespace"}[5m])
                    seriesNameFormat: ""
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    minStep: ""
                    query: irate(pg_stat_bgwriter_buffers_clean{pod="$pod", namespace="$namespace"}[5m])
                    seriesNameFormat: ""
        "11":
          kind: Panel
          spec:
            display:
              name: Conflicts/Deadlocks
            plugin:
              kind: TimeSeriesChart
              spec: {}
            queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    minStep: ""
                    query: irate(pg_stat_database_conflicts{pod="$pod", namespace="$namespace",
                      datname=~"$datname"}[5m])
                    seriesNameFormat: ""
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    minStep: ""
                    query: irate(pg_stat_database_deadlocks{pod="$pod", namespace="$namespace",
                      datname=~"$datname"}[5m])
                    seriesNameFormat: ""
        "12":
          kind: Panel
          spec:
            display:
              name: Cache Hit Rate
            plugin:
              kind: TimeSeriesChart
              spec: {}
            queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    minStep: ""
                    query: pg_stat_database_blks_hit{pod="$pod", namespace="$namespace",
                      datname=~"$datname"} / (pg_stat_database_blks_read{pod="$pod",
                      namespace="$namespace", datname=~"$datname"} + pg_stat_database_blks_hit{pod="$pod",
                      namespace="$namespace", datname=~"$datname"})
                    seriesNameFormat: ""
        "13":
          kind: Panel
          spec:
            display:
              description: Total amount of data written to temporary files by queries
                in this database. All temporary files are counted, regardless of why
                the temporary file was created, and regardless of the log_temp_files
                setting.
              name: Temp File (Bytes)
            plugin:
              kind: TimeSeriesChart
              spec: {}
            queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    minStep: ""
                    query: irate(pg_stat_database_temp_bytes{pod="$pod", namespace="$namespace",
                      datname=~"$datname"}[5m])
                    seriesNameFormat: ""
        "14":
          kind: Panel
          spec:
            display:
              name: Checkpoint Stats
            plugin:
              kind: TimeSeriesChart
              spec: {}
            queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    minStep: ""
                    query: irate(pg_stat_bgwriter_checkpoint_write_time{pod="$pod",
                      namespace="$namespace"}[5m])
                    seriesNameFormat: write_time - Total amount of time that has been
                      spent in the portion of checkpoint processing where files are
                      written to disk.
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    minStep: ""
                    query: irate(pg_stat_bgwriter_checkpoint_sync_time{pod="$pod",
                      namespace="$namespace"}[5m])
                    seriesNameFormat: sync_time - Total amount of time that has been
                      spent in the portion of checkpoint processing where files are
                      synchronized to disk.
        "15":
          kind: Panel
          spec:
            display:
              name: Rows
            plugin:
              kind: TimeSeriesChart
              spec:
                legend:
                  mode: list
                  position: bottom
                  values: []
                visual:
                  areaOpacity: 0.1
                  connectNulls: true
                  display: line
                  lineStyle: solid
                  lineWidth: 1
                yAxis:
                  format:
                    unit: decimal
            queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    minStep: ""
                    query: sum(irate(pg_stat_database_tup_fetched{datname=~"$datname",
                      pod="$pod", namespace="$namespace"}[5m]))
                    seriesNameFormat: fetched
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    minStep: ""
                    query: sum(irate(pg_stat_database_tup_returned{datname=~"$datname",
                      pod="$pod", namespace="$namespace"}[5m]))
                    seriesNameFormat: returned
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    minStep: ""
                    query: sum(irate(pg_stat_database_tup_inserted{datname=~"$datname",
                      pod="$pod", namespace="$namespace"}[5m]))
                    seriesNameFormat: inserted
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    minStep: ""
                    query: sum(irate(pg_stat_database_tup_updated{datname=~"$datname",
                      pod="$pod", namespace="$namespace"}[5m]))
                    seriesNameFormat: updated
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    minStep: ""
                    query: sum(irate(pg_stat_database_tup_deleted{datname=~"$datname",
                      pod="$pod", namespace="$namespace"}[5m]))
                    seriesNameFormat: deleted
      variables:
      - kind: ListVariable
        spec:
          allowAllValue: false
          allowMultiple: false
          defaultValue: Prometheus
          display:
            hidden: false
          name: datasource
          plugin:
            kind: DatasourceVariable
            spec:
              datasourcePluginKind: PrometheusDatasource
      - kind: ListVariable
        spec:
          allowAllValue: false
          allowMultiple: false
          defaultValue: demo
          display:
            hidden: false
            name: Namespace
          name: namespace
          plugin:
            kind: PrometheusLabelValuesVariable
            spec:
              labelName: namespace
              matchers:
              - kube_namespace_created
          sort: none
      - kind: ListVariable
        spec:
          allowAllValue: false
          allowMultiple: false
          defaultValue: ps-demo
          display:
            hidden: false
            name: postgres
          name: app
          plugin:
            kind: PrometheusPromQLVariable
            spec:
              expr: kubedb_com_postgres_created{namespace="$namespace"}
              labelName: app
          sort: alphabetical-asc
      - kind: ListVariable
        spec:
          allowAllValue: false
          allowMultiple: false
          defaultValue: ps-demo-0
          display:
            hidden: false
            name: pod
          name: pod
          plugin:
            kind: PrometheusLabelValuesVariable
            spec:
              labelName: pod
              matchers:
              - pg_up{namespace=~"$namespace",pod=~"${app}-.*"}
          sort: none
      - kind: ListVariable
        spec:
          allowAllValue: true
          allowMultiple: true
          defaultValue:
          - postgres
          display:
            hidden: false
            name: Database
          name: datname
          plugin:
            kind: PrometheusLabelValuesVariable
            spec:
              labelName: datname
              matchers: []
          sort: alphabetical-asc
  overwrite: true
  templatize: {}
