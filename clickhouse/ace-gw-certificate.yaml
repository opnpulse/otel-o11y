apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ace-gw
  namespace: monitoring
spec:
  ipAddresses:
  - 10.2.0.82
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: ace-gw
  keystores:
    jks:
      alias: aws
      create: true
      passwordSecretRef:
        key: password
        name: ace-gw-jkscred
  secretName: ace-gw-cert
  secretTemplate:
    annotations:
      vcluster.loft.sh/force-sync: "true"
  usages:
  - key agreement
  - digital signature
  - server auth

