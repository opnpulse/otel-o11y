<clickhouse>
<storage_configuration>
<disks>
<local>
<path>/var/lib/clickhouse/hot/</path>
</local>
<s3>
<type>s3</type>
<endpoint>https://minio.minio.svc.cluster.local:9000/telemetry/logs</endpoint>
<access_key_id>rootuser</access_key_id>
<secret_access_key>rootpass123</secret_access_key>
<region>us-east-1</region>
<metadata_path>/var/lib/clickhouse/disks/s3_disk/</metadata_path>
<skip_access_check>true</skip_access_check>
<http_connection_pool_size>10</http_connection_pool_size>
<s3_max_redirects>10</s3_max_redirects>
<server_side_encryption_customer_key_base64></server_side_encryption_customer_key_base64>
</s3>
</disks>
<policies>
<tiered>
<volumes>
<hot>
<disk>local</disk>
</hot>
<cold>
<disk>s3</disk>
</cold>
</volumes>
</tiered>
</policies>
</storage_configuration>
<openSSL>
<client>
<caConfig>/etc/clickhouse-server/certs/ca.pem</caConfig>
<verificationMode>relaxed</verificationMode>
<invalidCertificateHandler>
<name>AcceptCertificateHandler</name>
</invalidCertificateHandler>
</client>
</openSSL>
</clickhouse>